[package]
name = "astrobox-plugin-chaos-connect"
version = "0.2.3"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.63.0", features = ["async", "async-spawn"] }
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[dev-dependencies]
prost = "0.14"
chaos-connect-host-pb-fixture = { path = "tests/host-pb-fixture" }
serde_json = "1"
